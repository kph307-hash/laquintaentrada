<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Login Admin</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h2>Login Admin</h2>
      <a href="/tienda">Volver</a>
    </div>

    <div class="card">
      <form method="post" action="/admin/login">
        <input type="password" name="key" placeholder="Clave admin" required />
        <button type="submit">Entrar</button>
      </form>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
